# picom v13 :: EVENT HORIZON
# built from ~/.local/opt/i3-extras/src/picom for animation support.
# Everything per-window lives in `rules` / `animations` — the v13 way. The old
# *-exclude / inactive-* options are ignored once `rules` is set, so none are used here.

# ── backend ─────────────────────────────────────────────────────────────
# NVIDIA proprietary driver: GLX + vsync for tear-free output.
backend = "glx";
vsync = true;
# repaint the whole screen every frame instead of only "damaged" regions: with
# animations + blur on NVIDIA, partial repaints left faint 1px ghost lines (edges of
# popups/shadows that had just animated) inside windows. Full 1440p repaints are free
# on the 5070.
use-damage = false;
xrender-sync-fence = true;
# fullscreen games / video bypass the compositor (zero added latency)
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;
detect-client-opacity = true;
log-level = "warn";

# ── look ────────────────────────────────────────────────────────────────
corner-radius = 14;

shadow = true;
shadow-radius = 36;
shadow-opacity = 0.45;
shadow-offset-x = -34;
shadow-offset-y = -26;
shadow-color = "#000000";

blur: {
    method = "dual_kawase";
    strength = 8;
};
blur-background = true;

# fading is superseded by the animation scripts below
fading = false;

# ── animations ──────────────────────────────────────────────────────────
# One curve family everywhere (expo-out: fast start, long soft landing) so
# everything feels like the same system. Durations sit in the 160-280 ms band
# modern Hyprland setups use: snappy, never sluggish.
animations = (
    # new window: rises out of 90% scale while fading in
    {
        triggers = [ "open" ];
        opacity = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.22;
            start = 0;
            end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.28;
            start = 0.9;
            end = 1;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    # closing window: quick shrink + fade, gets out of the way fast
    {
        triggers = [ "close" ];
        opacity = {
            curve = "cubic-bezier(0.4, 0, 1, 1)";
            duration = 0.15;
            start = "window-raw-opacity-before";
            end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.4, 0, 1, 1)";
            duration = 0.15;
            start = 1;
            end = 0.92;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    # workspace switch: i3 unmaps the old workspace and maps the new one —
    # incoming windows glide up 40px and fade in, outgoing ones fade out fast
    {
        triggers = [ "show" ];
        opacity = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.24;
            start = 0;
            end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        offset-y = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.28;
            start = 40;
            end = 0;
        };
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "hide" ];
        opacity = {
            curve = "cubic-bezier(0.4, 0, 1, 1)";
            duration = 0.12;
            start = "window-raw-opacity-before";
            end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
    },
    # tiling reflow / resize / move: windows glide to their new spot
    {
        triggers = [ "geometry" ];
        scale-x = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.26;
            start = "window-width-before / window-width";
            end = 1;
        };
        scale-y = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.26;
            start = "window-height-before / window-height";
            end = 1;
        };
        offset-x = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.26;
            start = "window-x-before - window-x";
            end = 0;
        };
        offset-y = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.26;
            start = "window-y-before - window-y";
            end = 0;
        };
        saved-image-blend = {
            duration = 0.16;
            start = 1;
            end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    # focus dimming fades instead of snapping
    {
        triggers = [ "increase-opacity", "decrease-opacity" ];
        opacity = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.2;
            start = "window-raw-opacity-before";
            end = "window-raw-opacity";
        };
    }
);

# ── per-window rules (matched top to bottom, later wins) ────────────────
rules = (
    # no borders on windows, so focus reads through a light dim on the rest
    { match = "!focused && !group_focused && window_type = 'normal'"; dim = 0.10; },

    # popup menus / tooltips: no blur, no corners, no shadow, plain fade
    { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'combo' || window_type = 'notification' && class_g != 'Dunst'";
      shadow = false; corner-radius = 0; blur-background = false; },
    { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'";
      animations = (
          { triggers = [ "open", "show" ]; opacity = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.12; start = 0; end = "window-raw-opacity"; }; },
          { triggers = [ "close", "hide" ]; opacity = { duration = 0.08; start = "window-raw-opacity-before"; end = 0; }; }
      ); },
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
    # eww tooltips / tray menus are translucent like the terminal, so give them blur back
    { match = "class_g = 'Eww' && (window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'menu' || window_type = 'dropdown_menu')";
      blur-background = true; corner-radius = 10; },
    { match = "window_type = 'desktop'"; shadow = false; blur-background = false; corner-radius = 0; },
    { match = "window_type = 'dnd' || class_g = 'slop' || class_g = 'maim'"; shadow = false; blur-background = false; },

    # the eww bar: full-width see-through strip with just a hint of blur (the blurred
    # backdrop is mixed in at 30%), square, no shadow, no window animations
    { match = "name ^= 'Eww - bar'"; shadow = false; corner-radius = 0; dim = 0; blur-opacity = 0.3;
      animations = ( { triggers = [ "open", "show", "hide", "geometry" ]; var-none = 0; } ); },
    # eww popups (calendar, etc): drop down from the bar
    { match = "name ^= 'Eww - pop'"; shadow = true; corner-radius = 16; dim = 0;
      animations = (
          { triggers = [ "open", "show" ];
            opacity = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.2; start = 0; end = "window-raw-opacity"; };
            blur-opacity = "opacity"; shadow-opacity = "opacity";
            offset-y = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.26; start = -14; end = 0; };
            shadow-offset-y = "offset-y"; },
          { triggers = [ "close", "hide" ];
            opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = "window-raw-opacity-before"; end = 0; };
            blur-opacity = "opacity"; shadow-opacity = "opacity";
            offset-y = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 0; end = -10; };
            shadow-offset-y = "offset-y"; }
      ); },

    # eww drop-down sheets (music / calendar): each opens exactly on top of its bar pill
    # and unrolls downwards out of it like a pulled-down screen, rolls back up on close.
    # corner-radius = the pill's 11px so the sheet's top row covers the pill exactly.
    # Open: long, soft quart ease-out with a light fade so the leading edge never snaps;
    # close: symmetric ease-in-out, a bit quicker.
    { match = "name ^= 'Eww - drop'"; shadow = true; corner-radius = 11; dim = 0;
      animations = (
          { triggers = [ "open", "show" ];
            opacity = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.3; start = 0.35; end = "window-raw-opacity"; };
            blur-opacity = "opacity"; shadow-opacity = "opacity";
            crop-x = "window-x - 120"; crop-width = "window-width + 240"; crop-y = "window-y";
            crop-height = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.46; start = 0; end = "window-height + 100"; }; },
          { triggers = [ "close", "hide" ];
            opacity = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = 0.32; start = "window-raw-opacity-before"; end = 0.4; };
            blur-opacity = "opacity"; shadow-opacity = "opacity";
            crop-x = "window-x - 120"; crop-width = "window-width + 240"; crop-y = "window-y";
            crop-height = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = 0.32; start = "window-height + 100"; end = 0; }; }
      ); },

    # agent hover card: blue glass, 16 px corners, near-instant fade (shown/hidden by map/unmap)
    { match = "name = 'Eww - agentcard'"; shadow = true; corner-radius = 16; dim = 0; blur-background = true;
      animations = (
          { triggers = [ "open", "show" ];
            opacity = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.09; start = 0; end = "window-raw-opacity"; };
            blur-opacity = "opacity"; shadow-opacity = "opacity";
            offset-y = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.12; start = -4; end = 0; };
            shadow-offset-y = "offset-y"; },
          { triggers = [ "close", "hide" ];
            opacity = { duration = 0.07; start = "window-raw-opacity-before"; end = 0; };
            blur-opacity = "opacity"; shadow-opacity = "opacity"; }
      ); },

    # rofi: pops in from 94%
    { match = "class_g = 'Rofi'"; dim = 0; corner-radius = 20;
      animations = (
          { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.94; duration = 0.18; },
          { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.96; duration = 0.1; }
      ); },

    # world-clock city picker (rofi, from the calendar sheet): the drop-downs' 16 px corners
    { match = "class_g = 'Rofi' && name = 'World clock'"; corner-radius = 16; },

    # dunst: slides in from the right edge
    { match = "class_g = 'Dunst'"; dim = 0; corner-radius = 14;
      animations = (
          { triggers = [ "open", "show" ]; preset = "fly-in"; direction = "right"; duration = 0.26; },
          { triggers = [ "close", "hide" ]; preset = "fly-out"; direction = "right"; duration = 0.18; }
      ); },

    # i3lock: instant, never composited weirdly
    { match = "class_g = 'i3lock'"; shadow = false; blur-background = false; corner-radius = 0; unredir = true;
      animations = ( { triggers = [ "open", "close", "show", "hide" ]; var-none = 0; } ); },

    # fullscreen (video, games): square, no shadow, no dimming
    { match = "fullscreen"; corner-radius = 0; shadow = false; dim = 0; },
    { match = "name *= 'Picture in picture' || name *= 'Picture-in-Picture'"; dim = 0; }
);
